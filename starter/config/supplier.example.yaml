# РЕКВИЗИТЫ ТВОЕЙ СТОРОНЫ (Исполнитель / Поставщик / Продавец).
#
# Скопируй в supplier.yaml и подставь свои. Реальный supplier.yaml — в .gitignore:
# он содержит расчётный счёт. В git уходит только этот пример с нулями.
#
#   cp config/supplier.example.yaml config/supplier.yaml
#
# Эти значения печатаются в блоке реквизитов документа и в QR-коде счёта.

supplier:
  name_full: 'Общество с ограниченной ответственностью «Пример»'
  name_short: 'ООО «Пример»'
  inn: '0000000000'
  kpp: '000000000'
  ogrn: '0000000000000'
  address: '000000, г. Город, ул. Улица, д. 0, оф. 0'
  bank: 'АО «Банк»'
  rs: '40700000000000000001'
  ks: '30100000000000000006'
  bik: '040000000'
  email: 'mail@example.com'
  phone: '+7 000 000-00-00'
  # «в лице ...» (родительный падеж) и основание полномочий — для преамбулы договора
  signer_clause: 'в лице генерального директора Фамилия Имя Отчество'
  signer_basis: 'Устава'
  signer_role_nom: 'Генеральный директор'
  signer_short: 'Фамилия И.О.'
  # Система налогообложения — строка в счёте и акте. Пустая = не печатается.
  vat_note: 'НДС не облагается'
