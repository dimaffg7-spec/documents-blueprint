# ТИПЫ ДОКУМЕНТОВ — главный конфиг сервиса.
#
# Тип документа = шаблон(ы) + активные секции формы + дефолты текстов.
# Новый тип добавляется ЗДЕСЬ + шаблон .docx + (при нужде) ветка в context.py.
# Не в коде: список типов в коде = каждый новый документ через программиста.
#
# form_sections — какие секции формы показывать для этого типа. Остальные форма
# ПРЯЧЕТ И ДИЗЕЙБЛИТ (см. docs/09-gotchas.md, грабля №1: скрытые поля с теми же
# именами уходят на сервер и перебивают активные).
#
# Ниже — два ДЕМО-типа. Замени их своими: услуги, поставка, аренда, подряд,
# NDA, акт по промо-акции — что угодно, механика одна.

doc_types:
  services:
    label: 'Договор возмездного оказания услуг'
    template: 'dogovor_services.docx'
    contract_title: 'возмездного оказания услуг'
    # Предмет 2.1 — дефолт подставляется в форму, оператор может переписать.
    subject_default: 'консультационные услуги по предмету, согласованному Сторонами в Приложении №1 к настоящему Договору'
    format_line: 'в формате очных и/или дистанционных консультаций'
    # Состав услуг Приложения №1. Строка = пункт списка.
    services_default:
      - 'анализ исходных данных Заказчика'
      - 'подготовка рекомендаций'
      - 'сопровождение внедрения рекомендаций'
    form_sections: [subject, services_text, single_date, prepay, closing_doc]

  supply:
    label: 'Договор поставки'
    template: 'dogovor_supply.docx'
    contract_title: 'поставки товара'
    subject_default: 'товар, наименование, количество и цена которого согласованы Сторонами в Спецификации (Приложение №1)'
    format_line: 'на условиях самовывоза со склада Поставщика'
    services_default:
      - 'передача товара по Спецификации'
      - 'передача сопроводительных документов'
    form_sections: [subject, services_text, date_range, prepay, closing_doc]

# ЗАКРЫВАЮЩИЕ ДОКУМЕНТЫ. Отдельные шаблоны, общий контекст с договором:
# закрывающий = тот же предмет + та же сумма + номер и дата договора-основания.
closing_types:
  akt:
    label: 'Акт оказанных услуг'
    template: 'akt.docx'
  invoice:
    label: 'Счёт на оплату'
    template: 'invoice.docx'
